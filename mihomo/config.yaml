# Embedded mihomo configuration for claude-cage.
#
# The only egress is the host's SOCKS5 proxy.  Inside the container
# 127.0.0.1:12005 is forwarded to the host's published port by
# the entrypoint (socat), so the upstream below is exactly the required
# single SOCKS5 proxy.
#
# Everything else listens on container loopback only:
#   - mixed-port 7890: HTTP/SOCKS5 listener used by applications
#   - 12005: local forward to the host's SOCKS5 service
mixed-port: 7890
bind-address: 127.0.0.1
allow-lan: false
mode: rule
log-level: info
ipv6: false

proxies:
  - name: host-proxy
    type: socks5
    server: 127.0.0.1
    port: 12005
    udp: false

rules:
  - MATCH,host-proxy
