# Embedded mihomo configuration template for claude-cage.
#
# The only egress is the host's SOCKS5 proxy.  Inside the container
# 127.0.0.1:${HOST_PROXY_PORT} is forwarded to the same port on the host by
# the entrypoint (socat), so the upstream below is exactly the required
# single SOCKS5 proxy.
#
# ${HOST_PROXY_PORT} is replaced by the entrypoint at container start; the
# value is set in compose.yml.
#
# Everything else listens on container loopback only:
#   - mixed-port 7890: HTTP/SOCKS5 listener used by applications
#   - ${HOST_PROXY_PORT}: local forward to the host's SOCKS5 service
mixed-port: 7890
bind-address: 127.0.0.1
allow-lan: false
mode: rule
log-level: info
ipv6: false

proxies:
  - name: host-proxy
    type: socks5
    server: 127.0.0.1
    port: ${HOST_PROXY_PORT}
    udp: false

rules:
  - MATCH,host-proxy
